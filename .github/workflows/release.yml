name: Publish Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Configure the four Android signing secrets before publishing a release." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          echo "ORG_GRADLE_PROJECT_releaseStoreFile=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseStorePassword=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseKeyAlias=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseKeyPassword=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          gh release create "${GITHUB_REF_NAME}" "$APK" --title "Photo Carousel ${GITHUB_REF_NAME}" --generate-notes
